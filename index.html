<title>PlanPin</title>
<script type="module" src="pdf-init.mjs"></script>
<script src="pdf-lib.min.js"></script>
<style>
html {
  touch-action: manipulation;
}
/* Layout: one-screen app. Project list → full-bleed drawing with pan/zoom, bottom bar, slide-up sheets. Markers are numbered site tags. */
:root {
  /* the drawing tools' columns (V1.8.23, the user chose B: narrower, closer to the edge): from the screen's edge, between
     two columns, around and between the cells; the buttons at the bottom centred under the column */
  --eedge: 4px;
  --ecolgap: 4px;
  --egap: 3px;
  --ledge: 6px;
  --paper: #f6f7f5;
  --surface: #ffffff;
  --ink: #1d2321;
  --muted: #5f6a66;
  --line: #d9dedb;
  --tag: #c2410c;
  --tag-deep: #9a3412;
  --tag-ink: #ffffff;
  --tag-soft: #fdebdd;
  --brand: #c2410c; /* the drawing's markers and the kind Inventering: orange whatever the app's colour */
  --ok: #2f7d55;
  --danger: #b3261e;
  --plan-bg: #e9ece9;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: var(--font-ui); /* numbers in the same font as all other text, with even widths (tabular-nums) */
  /* text sizes: the only ones used in the app */
  --fs-xs: 12px;
  --fs-s: 13px;
  --fs-m: 14px;
  --fs-b: 16px;
  --fs-l: 18px;
  --fs-xl: 20px;
  --fs-xxl: 24px;
  /* line heights: headings and short labels, running text */
  --lh-tight: 1.2;
  --lh: 1.4;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141716;
    --surface: #1d2120;
    --ink: #e8ece9;
    --muted: #9aa5a0;
    --line: #323836;
    --tag: #ff7a33;
    --tag-deep: #ff7a33;
    --tag-ink: #1a0d06;
    --tag-soft: #3b2416;
    --brand: #ff7a33;
    --ok: #5fc08e;
    --danger: #ff8a80;
    --plan-bg: #0e1110;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141716;
  --surface: #1d2120;
  --ink: #e8ece9;
  --muted: #9aa5a0;
  --line: #323836;
  --tag: #ff7a33;
  --tag-deep: #ff7a33;
  --tag-ink: #1a0d06;
  --tag-soft: #3b2416;
  --brand: #ff7a33;
  --ok: #5fc08e;
  --danger: #ff8a80;
  --plan-bg: #0e1110;
  color-scheme: dark;
}
html,
body {
  height: 100%;
}
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--fs-b);
  line-height: var(--lh);
  font-variant-numeric: tabular-nums;
  overflow: hidden;
}
* {
  box-sizing: border-box;
}
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}
button:focus-visible,
input:focus-visible,
textarea:focus-visible,
label:focus-within {
  outline: 2px solid var(--tag);
  outline-offset: 2px;
}
.app {
  height: 100%;
  display: flex;
  flex-direction: column;
}
.view {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.bar h1 {
  font-size: var(--fs-l);
  font-weight: 700;
  margin: 0;
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: 0.01em;
}
.iconbtn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 8px;
  height: 44px; /* every tap target at least 44 px */
  min-width: 44px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-weight: 600;
  font-size: var(--fs-m);
}
.btn {
  border: 0;
  border-radius: var(--r);
  padding: 12px 16px;
  min-height: 48px; /* all buttons the same height (V1.7.23, the user: 48 – Android's own size); the top bar keeps 44 */
  font-weight: 600;
  font-size: var(--fs-b);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-align: center; /* a label or a link that looks like a button: its words centred also on two rows */
}
.btn.primary {
  background: var(--tag);
  color: var(--tag-ink);
}
.btn.ghost {
  background: transparent;
  border: 1px solid var(--line);
}
.btn.danger {
  background: transparent;
  color: var(--danger);
  border: 1px solid var(--line);
}
.btn[disabled] {
  opacity: 0.5;
  cursor: default;
}
/* Everything that can be pressed answers the finger the same way (V1.6.39): it sinks a little while it is held, as the
   assignment cards and the drawing tools already did. The browser's own grey flash over the button is turned off – the
   two together looked like two different apps. Wide things (rows, whole-width buttons) sink less than small ones.
   V1.7.4: the flash is off for the whole page (it is inherited), not only for buttons and links – it flashed blue over
   a tapped object in the list, and since the row opens and the list scrolls while it shows, the flash also landed
   over the chips above it. */
html {
  -webkit-tap-highlight-color: transparent;
}
.btn,
.iconbtn,
.sbtn,
.pbtn,
.cat,
.seg,
.floor,
.sideclose,
.flupe,
.mrow,
.choice,
.ocard,
.linkbtn {
  transition:
    transform 0.1s ease-out,
    opacity 0.1s ease-out,
    background-color 0.1s ease-out;
}
.iconbtn:active,
.sbtn:active,
.pbtn:active,
.cat:active,
.seg:active,
.floor:active,
.sideclose:active,
.flupe:active {
  transform: scale(0.95);
}
.btn:active,
.choice:active {
  transform: scale(0.985);
  opacity: 0.85;
}
/* rows of a list are not moved (their frame is the list's): they darken */
.mrow:active,
.ocard:active {
  background: var(--plan-bg);
}
.linkbtn:active {
  opacity: 0.6;
}
.btn[disabled]:active,
.sbtn[disabled]:active,
.seg.on:active {
  transform: none;
}
.scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.eyebrow {
  font-size: var(--fs-xs);
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}
.note {
  font-size: var(--fs-s);
  color: var(--muted);
  background: var(--tag-soft);
  border-radius: 8px;
  padding: 8px 12px;
  line-height: var(--lh);
}

/* Projects (home page) */
:root {
  --k-inv: var(--brand);
  --k-ctl: #2f7d55;
  --blue: #3b6ea5;
  --chk: #0f766e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --k-ctl: #5fc08e;
    --blue: #7fa9dc;
    --chk: #2dd4bf;
  }
}
:root[data-theme="dark"] {
  --k-ctl: #5fc08e;
  --blue: #7fa9dc;
  --chk: #2dd4bf;
}
.home .bar {
  gap: 8px;
  flex-wrap: wrap; /* big text on a narrow phone: the button goes under the name instead of squeezing it */
}
.brand {
  flex: 1 1 auto; /* as wide as its name: with big text the button wraps under it instead of the name being cut */
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand h1 {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--fs-xxl);
  font-weight: 700;
  letter-spacing: 0.005em;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pinmark {
  flex: none;
  height: 27px;
  width: 20px;
}
.brand h1 .word {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pinmark .body {
  fill: var(--tag);
}
.pinmark .hole {
  fill: var(--surface);
}
.brand h1 .acc {
  color: var(--tag);
}
.lockbtn {
  padding: 0;
  width: 38px;
  flex: none;
}
.gearbtn {
  padding: 0;
  width: 38px;
  flex: none;
  color: var(--muted);
}
.gear .hole {
  fill: var(--surface);
}
.themeseg {
  width: 100%;
}
/* the choices share the row equally – but none is narrower than its words (Auto (×2) beside ×1): that one takes the
   room it needs and the others share the rest, and with big text a choice goes to a second row */
.themeseg .seg {
  flex: 1 1 44px;
  min-width: max-content;
  padding-inline: 6px; /* the row is shared: less air at the sides, so five choices stay on one row longer */
}
/* Skala: the scale and the paper side by side when both fit whole, otherwise one above the other ("Välj
   pappersformat" is never cut) */
.field .row.scalerow select {
  flex: 1 1 190px;
  min-width: 0;
}
.calib {
  position: absolute;
  left: 0;
  top: 0;
  overflow: visible;
  pointer-events: none;
  z-index: 4;
}
/* Ritningsinställningar → Underlag: the file the drawing came from */
.fileline {
  margin: 0;
  line-height: var(--lh);
  overflow-wrap: anywhere;
}
/* Ritningsinställningar → Underlag → Ritningsordning: the floors in order, each with up and down */
.ordrow {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
}
.ordrow + .ordrow {
  margin-top: 6px;
}
.ordrow.on {
  border-color: var(--tag);
  box-shadow: 0 0 0 1px var(--tag) inset;
}
.ordrow .ordn {
  font-family: var(--font-num);
  font-weight: 700;
  color: var(--muted);
  min-width: 18px;
  text-align: center;
}
.ordrow .ordname {
  font-weight: 600;
  overflow-wrap: anywhere;
}
.ordrow .sbtn {
  min-width: 44px;
  min-height: 44px;
  font-size: var(--fs-l);
}
.ordrow .sbtn:disabled {
  opacity: 0.35;
}
.sitem.picking,
.ocard.picking {
  position: relative;
  padding-left: 44px !important;
  cursor: pointer;
}
.sitem.picking::before,
.ocard.picking::before {
  content: "";
  position: absolute;
  left: 12px;
  top: 50%;
  width: 20px;
  height: 20px;
  margin-top: -10px;
  border: 2px solid var(--muted);
  border-radius: 6px;
  background: var(--surface);
}
.sitem.picked,
.ocard.picked {
  background: var(--tag-soft);
}
.sitem.picked::before,
.ocard.picked::before {
  background: var(--tag);
  border-color: var(--tag);
}
.sitem.picked::after,
.ocard.picked::after {
  content: "";
  position: absolute;
  left: 19px;
  top: 50%;
  width: 6px;
  height: 11px;
  margin-top: -8px;
  border: solid var(--tag-ink);
  border-width: 0 2.5px 2.5px 0;
  transform: rotate(45deg);
}
/* Alla under the search (V1.7.34): a box like the objects' own, at the same place from the list's edge (the side
   list's items have a 4 px edge on the left), beside how many are chosen; Klar to the right */
.prow1.pickall {
  flex-wrap: wrap; /* very big text on a narrow phone: Klar goes to its own row, to the right */
  gap: 0 6px;
  min-width: 0;
  border-bottom: 1px solid var(--line);
}
/* the search part never gets wider than the list because of the row under it (big text on a narrow phone) */
.side .fbar {
  grid-template-columns: minmax(0, 1fr);
}
.side .prow1.pickall {
  border-left: 4px solid transparent;
  padding-right: 12px;
}
/* under the search: to the list's edges, out of the search part's own padding. Closer to the chips than the bar's own
   gap (V1.7.42, the user): the row is 44 px high for the finger, so its box already has air above it */
.fbar .prow1.pickall {
  margin-top: -4px;
}
.side .fbar .prow1.pickall {
  margin: -4px -10px -8px;
}
.pickallbox {
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
  min-height: 44px;
  padding: 4px 4px 4px 42px; /* with normal text "Välj objekt", the box and Klar fit the narrowest list (184 px) */
  border: 0;
  background: none;
  color: var(--ink);
  text-align: left;
  font: inherit;
  cursor: pointer;
}
/* the box shrinks (its words break) before Klar leaves the row: a row is filled by the items' widths before they shrink,
   so with its full width as the start "Välj objekt" sent Klar to a row of its own at big text though both fit (V1.7.45,
   c_pick_pair_random) – now Klar goes only when the box's longest word and Klar cannot share the row */
.prow1.pickall .pickallbox {
  flex: 1 1 0;
  min-width: min-content;
}
.prow1.pickall .pickallbox .pcnt {
  font-size: var(--fs-b);
  white-space: normal; /* not the count row's nowrap (.prow1 .pcnt): "Välj objekt" may break between its words */
}
.prow1.pickall #pickdone {
  flex: none;
  margin-left: auto;
  min-height: 44px;
}
.pickallbox::before {
  content: "";
  position: absolute;
  left: 12px;
  top: 50%;
  width: 20px;
  height: 20px;
  margin-top: -10px;
  border: 2px solid var(--muted);
  border-radius: 6px;
  background: var(--surface);
}
.pickallbox.on::before {
  background: var(--tag);
  border-color: var(--tag);
}
.pickallbox.on::after {
  content: "";
  position: absolute;
  left: 19px;
  top: 50%;
  width: 6px;
  height: 11px;
  margin-top: -8px;
  border: solid var(--tag-ink);
  border-width: 0 2.5px 2.5px 0;
  transform: rotate(45deg);
}
.sitem.picking .sactions {
  display: none !important;
}
.pickbar {
  position: sticky;
  bottom: 0;
  z-index: 3;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 0px));
  display: grid;
  grid-template-columns: minmax(0, 1fr); /* as wide as the list, never as wide as its widest row (V1.6.38) */
  gap: 8px;
  box-shadow: 0 -6px 14px rgba(0, 0, 0, 0.08);
}
.prow1 {
  display: flex;
  flex-wrap: wrap; /* big text: Alla and Klar go under the count, together */
  align-items: center;
  gap: 0 10px;
}
.prow1 .pcnt {
  flex: 1 1 auto;
  font-size: var(--fs-b);
  white-space: nowrap;
}
/* Välj in the side list: the buttons on one row at the bottom that scrolls sideways when they do not fit (it fades out
   where there are more) */
.pickbar.pbonly {
  padding-top: 8px;
  padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
}
.pickbar.pbonly .prow2 {
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
}
.pickbar.pbonly .prow2::-webkit-scrollbar {
  display: none;
}
.pickbar.pbonly .prow2 .sbtn {
  flex: 1 0 auto;
  white-space: nowrap;
}
.pickbar .prow2 {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.pickbar .prow2 .sbtn {
  flex: 1 1 auto;
}
.pickbar button[disabled] {
  opacity: 0.45;
}
.opick .pickbar {
  position: static;
}
.orow {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}
.orow .addobj {
  flex: 1;
  margin-bottom: 0; /* in the row the margin made Välj beside it taller (granskningen #10) */
}
@media (max-width: 420px) {
  .brand h1 {
    font-size: var(--fs-xl);
    gap: 8px;
  }
  .home .bar {
    gap: 6px;
  }
}
.newbtn {
  min-height: 44px; /* in the top bar, as tall as the buttons beside it */
  gap: 0;
  white-space: pre;
  padding: 9px 14px;
  font-size: var(--fs-b);
  flex: none;
}
@media (max-width: 300px) {
  .newbtn .long {
    display: none;
  }
}
@media (max-width: 345px) {
  .home .bar:has(.lockbtn) .newbtn .long {
    display: none;
  }
}
.lockbtn .sicon {
  background: transparent;
}
.storinfo {
  display: grid;
  gap: 4px;
  font-size: var(--fs-s);
  line-height: var(--lh);
}
.storinfo p {
  margin: 0;
  color: var(--muted);
}
.storinfo p.ok {
  color: var(--ok);
}
.storinfo p.warn {
  color: var(--ink);
}
.storinfo .linkbtn {
  justify-self: start;
}
.lostcard {
  display: grid;
  gap: 8px;
  border: 1.5px solid var(--danger);
  background: color-mix(in srgb, var(--danger) 8%, var(--surface));
  border-radius: var(--r);
  padding: 14px;
  margin-bottom: 16px;
}
.lostcard b {
  font-size: var(--fs-b);
  color: var(--danger);
}
.lostcard p {
  margin: 0;
  line-height: var(--lh);
  font-size: var(--fs-m);
}
.lostcard .row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.lostcard .btn {
  flex: 1 1 150px;
  padding: 10px 14px;
  font-size: var(--fs-b);
}
/* Säkerhet och lagring: its three parts (Lagring, Säkerhetskopia, Säkerhet), each under a heading and a line */
.secpart {
  display: grid;
  gap: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  scroll-margin-top: 8px;
}
.sechead {
  margin: 0;
  font-size: var(--fs-l);
  font-weight: 700;
  color: var(--ink);
}
.secpart .bkbtns {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.secpart .bkbtns > *,
.secpart .bkbtns .btn {
  flex: 1 1 170px; /* side by side when both fit whole, otherwise one above the other… */
  min-width: fit-content; /* …and never a word broken: "Läs in säkerhetskopia" is longer than the 170 px (V1.6.39) */
}
/* the web app's backup reminder (49-autokopia): the assignments it is about */
.remindlist {
  margin: 0;
  padding-left: 20px;
  line-height: var(--lh);
  overflow-wrap: anywhere;
}
.autolist {
  display: grid;
  gap: 8px;
}
.autorow {
  display: grid;
  gap: 2px;
  min-width: 0;
}
.autorow b,
.autorow small {
  overflow-wrap: anywhere;
}
.status {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 9px 12px;
  margin-bottom: 18px;
}
.status b {
  display: block;
  font-size: var(--fs-b);
}
.status small {
  display: block;
  color: var(--muted);
  font-size: var(--fs-s);
  line-height: var(--lh);
  margin-top: 1px;
}
.status .linkbtn {
  white-space: nowrap;
}
.sicon {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--tag-soft);
  position: relative;
}
.sicon::before {
  content: "";
  position: absolute;
  left: 8px;
  top: 12px;
  width: 12px;
  height: 9px;
  border-radius: 2px;
  background: var(--tag-deep);
}
.sicon::after {
  content: "";
  position: absolute;
  left: 10px;
  top: 6px;
  width: 8px;
  height: 9px;
  border: 2px solid var(--tag-deep);
  border-bottom: 0;
  border-radius: 5px 5px 0 0;
  box-sizing: border-box;
}
.status:not(.on) .sicon::after {
  left: 12px;
  width: 8px;
}
.listhead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.sortseg {
  display: inline-flex;
  flex-wrap: wrap; /* big text: a choice that does not fit goes to a second row instead of being cut */
  background: var(--plan-bg);
  border-radius: 9px;
  padding: 3px;
  gap: 2px;
}
.seg {
  border: 0;
  background: transparent;
  border-radius: 7px;
  padding: 6px 11px;
  font-size: var(--fs-m);
  font-weight: 600;
  color: var(--muted);
  min-width: 44px;
  min-height: 44px;
  white-space: nowrap;
}
.seg.on {
  background: var(--surface);
  color: var(--ink);
  box-shadow:
    0 1px 2px rgba(0, 0, 0, 0.12),
    0 0 0 1px var(--line);
}
.plist {
  display: grid;
  gap: 10px;
  margin-top: 12px;
}
.ghead {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: var(--fs-b);
  margin: 8px 2px -2px;
}
.ghead:first-child {
  margin-top: 0;
}
.ghead em {
  font-style: normal;
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-xs);
  color: var(--muted);
  font-weight: 600;
}
.kdot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--k-inv);
}
.pcard {
  display: grid;
  grid-template-columns: 76px 1fr auto;
  gap: 12px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 8px 10px 8px 8px;
  text-align: left;
  width: 100%;
  transition:
    border-color 0.15s,
    transform 0.1s;
}
.pcard:active {
  transform: scale(0.99);
}
@media (hover: hover) {
  .pcard:hover {
    border-color: var(--muted);
  }
}
.pthumb {
  width: 76px;
  height: 64px;
  border-radius: 7px;
  overflow: hidden;
  background: var(--plan-bg);
  border: 1px solid var(--line);
}
.pthumb img,
.pthumb .ph {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.pthumb .ph {
  background: repeating-linear-gradient(to bottom, transparent 0 11px, var(--line) 11px 12px);
  background-position: 0 6px;
  position: relative;
}
.pthumb .ph::before {
  content: "";
  position: absolute;
  left: 12px;
  top: 0;
  bottom: 0;
  width: 1.5px;
  background: color-mix(in srgb, var(--blue) 45%, transparent);
}
.pbody {
  min-width: 0;
  display: grid;
  gap: 3px;
  justify-items: start;
}
.pbody b {
  font-size: var(--fs-b);
  line-height: var(--lh-tight);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
  max-width: 100%;
}
.pbody small {
  color: var(--muted);
  font-size: var(--fs-s);
  line-height: var(--lh);
  overflow-wrap: anywhere; /* big text on a narrow phone: the number and date wrap instead of running out of the card */
}
.pbody small span {
  display: inline-block; /* kept whole on its row: the line breaks between the parts, not inside "3 ritningar" (V1.6.39) */
  max-width: 100%;
}
.kchip {
  font-size: var(--fs-xs);
  font-weight: 600;
  border-radius: 999px;
  padding: 1px 8px 1px 7px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--k-inv);
  background: color-mix(in srgb, var(--k-inv) 13%, transparent);
}
.kchip::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.k-ctl.kchip,
.k-ctl.kdot {
  --k-inv: var(--k-ctl);
}
.count {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-s);
  background: var(--tag-soft);
  color: var(--tag-deep);
  border-radius: 999px;
  padding: 3px 9px;
  font-weight: 600;
}
.pcount {
  display: grid;
  justify-items: center;
  line-height: 1;
  background: var(--tag-soft);
  color: var(--tag-deep);
  border-radius: 9px;
  padding: 6px 8px;
  min-width: 44px;
}
.pcount strong {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-b);
  font-weight: 600;
}
.pcount i {
  font-style: normal;
  font-size: var(--fs-xs);
  font-weight: 600;
  margin-top: 2px;
  opacity: 0.85;
}
.backups {
  margin-top: 26px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  display: grid;
  gap: 10px;
}
.backups .btnrow {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.backups .btn {
  flex: 1 1 200px; /* on a phone each button has its own row ("Säkerhetskopiera alla" never breaks); side by side on a tablet */
  padding: 10px 14px;
  font-size: var(--fs-b);
}
@media (min-width: 760px) {
  .home .scroll > * {
    max-width: 760px;
    margin-left: auto;
    margin-right: auto;
  }
  .plist {
    grid-template-columns: 1fr 1fr;
  }
  .ghead {
    grid-column: 1/-1;
  }
}
.empty {
  margin-top: 24px;
  border: 1.5px dashed var(--line);
  border-radius: var(--r);
  padding: 24px 18px;
  display: grid;
  gap: 14px;
}
.empty h2 {
  margin: 0;
  font-size: var(--fs-xl);
  text-wrap: balance;
}
.steps {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 10px;
}
.steps li {
  display: grid;
  grid-template-columns: 30px 1fr;
  gap: 10px;
  align-items: start;
  color: var(--muted);
  line-height: var(--lh);
}
.steps li span {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--tag);
  color: var(--tag-ink);
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-s);
  display: grid;
  place-items: center;
  font-weight: 600;
}

/* Plan view */
.vp {
  flex: 1;
  min-height: 0;
  position: relative;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  background: var(--plan-bg);
  touch-action: none;
  cursor: crosshair;
}
.stage {
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
}
.stage img {
  display: block;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
  max-width: none;
  background: #fff;
  box-shadow: 0 1px 6px rgba(0, 0, 0, 0.18);
}
.mk {
  position: absolute;
  width: 0;
  height: 0;
}
.mk i {
  position: absolute;
  left: 0;
  top: 0;
  transform: translate(-50%, -50%) scale(var(--inv, 1));
  transform-origin: 50% 50%;
  font-style: normal;
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  font-size: 14px; /* on the drawing: sized with the drawing, not with the phone's text size */
  -webkit-text-size-adjust: none;
  text-size-adjust: none;
  color: #fff;
  background: var(--mc, var(--brand));
  min-width: 28px;
  height: 28px;
  padding: 0 6px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  box-shadow:
    0 0 0 2px #fff,
    0 2px 6px rgba(0, 0, 0, 0.35);
}
.mk.pending i {
  outline: 2px dashed var(--ink);
  outline-offset: 2px;
}
/* Samarbeta: an object the other side has not got yet (not in any sent file, or changed since) is square with soft
   corners, in its group's colour as usual; round again once a file with it has been sent. The small dots follow. */
.mk.unsynced i {
  border-radius: 7px;
}
.mk.unsynced.sel::after {
  border-radius: 14px;
}
/* Samarbeta, the owner: an object with a proposed change waiting (collReviewSheet) has a dashed ring in its colour */
.mk.proposed i {
  outline: 2px dashed var(--mc, var(--brand));
  outline-offset: 3px;
}
/* a checkpoint (Checklista) not yet an object: a white square tag with a dashed teal edge and a check mark; ticked: teal */
.mk.chk i {
  background: #fff;
  color: var(--chk);
  border: 2px dashed var(--chk);
  border-radius: 7px;
  min-width: 28px;
  padding: 0;
  font-size: 15px;
}
.mk.chk.done i {
  background: var(--chk);
  color: #fff;
  border-style: solid;
}
/* V1.9.3: Objekt | Checkpunkt in a new object's sheet – the two share the row half and half (the user) */
.sortseg.half {
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.sortseg.half .seg {
  white-space: normal;
}
.bigtag.chkbadge {
  background: var(--chk);
  color: #fff;
}
.chkbanner {
  display: grid;
  gap: 2px;
  padding: 10px 12px;
  border: 2px dashed var(--chk);
  border-radius: 10px;
  color: var(--ink);
}
.chkbanner small {
  color: var(--chk);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-size: 12px;
}
.chklist {
  display: grid;
  gap: 6px;
}
.chkrow {
  display: flex;
  flex-wrap: wrap; /* on a narrow screen the buttons take a row of their own, so a long word is never broken */
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
}
.chkrow .check {
  flex: 1 1 200px; /* less than that for the text (a long compound word) and the buttons move down */
  min-width: 0;
}
.chkrow .check span {
  display: grid;
  gap: 2px;
  overflow-wrap: anywhere;
}
.chkrow.done .check span {
  color: var(--muted);
}
.chkbtns {
  display: flex;
  gap: 6px;
  flex: none;
  margin-left: auto; /* to the right, also when on a row of their own */
}
.chkbtns .sbtn {
  flex: none; /* each as wide as its own word: shared equally, "Ta bort" was squeezed against its frame beside "Flytta" */
  padding-inline: 8px;
  white-space: nowrap;
}
.chkadd {
  display: flex;
  gap: 8px;
}
.chkadd input {
  flex: 1;
  min-width: 0;
}
/* between number and dot the marker glides: the badge shrinks and its number fades (scale is its own property, so
   it never lags behind the zoom; not with Animerade övergångar off, or less motion on the phone) */
@media (prefers-reduced-motion: no-preference) {
  :root:not(.noanim) .mk i {
    transition:
      scale 0.24s ease,
      color 0.18s ease;
  }
}
/* a marker that would touch another at full size: a small dot in its group's colour (see fitMarkers), about 11 px */
.mk:not(.dot):not(.fout) {
  z-index: 1; /* the markers with their number lie over the dots */
}
.mk.dot i {
  scale: 0.4;
  color: transparent;
}
.mk.dot.long i {
  scale: 0.33;
}

.hint {
  position: absolute;
  left: 50%;
  top: 12px;
  transform: translateX(-50%);
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 6px 14px;
  font-size: var(--fs-m);
  line-height: var(--lh);
  text-align: center;
  pointer-events: none;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
  width: max-content;
  max-width: calc(100% - 32px); /* long texts wrap instead of being cut off */
  transition: opacity 0.4s;
}
.foot {
  display: flex;
  gap: 10px;
  padding-block: 10px;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.foot .btn {
  flex: 1;
}

/* Sheets */
/* .scrimout/.sheetout: a closed sheet on its way down (takeSheet) – it looks the same but is no sheet any more */
.scrim,
.scrimout {
  position: fixed;
  inset: 0;
  background: rgba(10, 14, 12, 0.45);
  z-index: 20;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.scrimout {
  pointer-events: none;
}
.sheet,
.sheetout {
  background: var(--surface);
  width: 100%;
  max-width: 560px;
  max-height: 92%;
  /* --keep: the height of the sheet whose place this one took (standIn), so that it stands still; what is in it
     starts at the top */
  min-height: min(var(--keep, 0px), 92%);
  align-content: start;
  overflow-y: auto;
  border-radius: 16px 16px 0 0;
  padding-block: 14px calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 14px;
  overscroll-behavior: contain;
  will-change: transform;
  overflow-wrap: anywhere; /* big text: a long heading or word wraps instead of running out of the sheet */
}
/* With buttons that stay at its bottom edge (.savebar) the room under them is a border instead of padding: what
   scrolls in the sheet then ends at the buttons, and nothing passes in a strip under them */
.sheet.hasbar,
.sheetout.hasbar {
  padding-bottom: 0;
  border-bottom: calc(16px + env(safe-area-inset-bottom, 0px)) solid var(--surface);
}
.sheet .grab,
.sheetout .grab {
  width: 44px;
  height: 5px;
  border-radius: 3px;
  background: var(--line);
  justify-self: center;
  margin: -4px 0 -2px;
  position: relative;
}
.sheet .grab::before {
  content: "";
  position: absolute;
  inset: -14px -40px;
}
.shead {
  display: flex;
  align-items: center;
  gap: 12px;
}
.bigtag {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  font-size: var(--fs-xl);
  background: var(--tag);
  color: var(--tag-ink);
  height: 40px;
  min-width: 40px;
  padding: 0 10px;
  border-radius: 999px;
  display: grid;
  place-items: center;
}
.bigtag[style*="background"] {
  color: #fff;
}
.shead h2 {
  margin: 0;
  font-size: min(
    var(--fs-xl),
    7.4vw
  ); /* with big text on a narrow screen the heading shrinks a little rather than wraps ("Uppdragsinställningar") */
  flex: 1;
}
.photo {
  border-radius: var(--r);
  background: var(--plan-bg);
  aspect-ratio: 4/3;
  max-width: 100%;
  display: grid;
  place-items: center;
  overflow: hidden;
  color: var(--muted);
  font-size: var(--fs-m);
  text-align: center;
  padding: 0;
}
.photo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
.pick {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.pick label {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 12px;
  font-weight: 600;
  cursor: pointer;
  background: var(--surface);
}
.pick label {
  position: relative;
  overflow: hidden;
}
.pick input,
.hidden-input {
  position: absolute;
  left: 0;
  top: 0;
  width: 1px;
  height: 1px;
  opacity: 0;
}
label.btn {
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.field {
  display: grid;
  gap: 6px;
}
.field label {
  font-size: var(--fs-s);
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
textarea,
input[type="text"],
input[type="password"] {
  width: 100%;
  font: inherit;
  font-size: var(--fs-b);
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 12px;
}
textarea {
  min-height: 76px;
  resize: vertical;
}
.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.row .btn {
  flex: 1 1 120px;
}

/* List */

/* the row of tabs: the bar has the background and the line, the row in it scrolls sideways and fades at an edge
   where there is more (floorTabs) */
.floorsbar {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.floors {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  scrollbar-width: none;
}
.floors::-webkit-scrollbar {
  display: none;
}
.floor {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 44px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-weight: 600;
  font-size: var(--fs-m);
  white-space: nowrap;
  cursor: pointer;
}
/* a long drawing name (V1.7.29, the same rule as the lists): the tab is at most most of the row, the count goes first
   (fitCount, 18) and then the name is cut with "…" */
.floor {
  max-width: 85%;
}
.floor b {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.floor .fcount {
  flex: none;
}
/* a heading with a count beside it (a drawing's page): one line, the count goes first, then "…" */
.shead h2.fitname {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.shead .count {
  flex: none;
}
/* V1.8.44: a heading of the app's own words with a name beside it (the drawing's, in the object's sheet and Skala):
   the heading keeps its words on one row, and the name is shortened with … when there is not room for all of it */
.shead h2.keep {
  flex: 1 0 auto;
  white-space: nowrap;
}
.shead .count.long {
  flex: 0 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.shead {
  min-width: 0; /* in the page's grid: the heading follows the sheet's width instead of widening it */
}
.floor .fcount {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 1px 7px;
}
.floor.on {
  background: var(--ink);
  color: var(--surface);
  border-color: var(--ink);
}
.floor.on .fcount {
  color: var(--ink);
  background: var(--surface);
  border-color: var(--surface);
}
.floor.add {
  border-style: dashed;
  color: var(--tag);
  user-select: none;
  -webkit-user-select: none;
}
.check {
  display: flex;
  gap: 10px;
  align-items: center;
  min-height: 44px;
  font-weight: 600;
  cursor: pointer;
}
/* "Symboler visas på:" in the export sheet: one box per group (just the name), indented under the text */
.symon {
  display: grid;
  gap: 0;
}
.symon > small {
  font-weight: 600;
  color: var(--muted);
  padding-top: 6px;
}
.check.sub {
  padding-left: 30px;
}
/* the list's filter: a thin line between the groups and the categories */
.fsep {
  flex: 0 0 1px;
  align-self: stretch;
  margin: 6px 2px;
  background: var(--line);
}
.check input {
  width: 20px;
  height: 20px;
  accent-color: var(--tag);
}
/* Utseende och layout → Håll still: one row, the seconds in a small box at its right (V1.8.30) */
.check.holdrow {
  cursor: default;
}
.check.holdrow input {
  width: 3.6em;
  height: 36px;
  margin-left: auto;
  padding: 0 6px;
  text-align: center;
  font: inherit;
  font-weight: 600;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.check.holdrow .unit {
  color: var(--muted);
  font-weight: 600;
}
.flist {
  display: grid;
  border: 1px solid var(--line);
  border-radius: var(--r);
  overflow: hidden;
}
.frow {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 10px;
  text-align: left;
  padding: 10px 12px;
  background: var(--surface);
  border: 0;
  border-bottom: 1px solid var(--line);
}
.frow:last-child {
  border-bottom: 0;
}
.frow span {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-s);
  color: var(--muted);
  text-align: right;
}
/* The list's width, said once: just under half the drawing's area, at most 250 px – and never under 184 px, which is
   what its heading (Objekt, Välj, ✕) and the Välj bar need on a narrow phone (V1.6.38: at 345 px they were cut off) */
.vp {
  --sidew: max(184px, min(48%, 250px));
}
.side {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: var(--sidew);
  background: var(--surface);
  border-left: 1px solid var(--line);
  box-shadow: -6px 0 18px rgba(0, 0, 0, 0.14);
  overflow-y: auto;
  touch-action: pan-y;
  overscroll-behavior: contain;
  z-index: 6;
  cursor: default;
}
.side {
  will-change: transform;
}
/* Objekt and the plan's name to the left, Välj and ✕ to the right. With big text or a long plan name the two do not
   fit beside each other: then the buttons take a row of their own (V1.6.38) – nothing is cut off by the list's edge */
.sidehead {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  padding: 10px 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.sidetitle {
  flex: 1 1 0; /* counts as its longest word when the row is filled: the plan's name wraps inside it before the buttons leave the row */
  max-width: 100%; /* a name of one very long word: a row of its own, and there the word breaks */
}
.sidehead b,
.sidehead span {
  display: block;
}
.sidehead b {
  font-size: var(--fs-b);
}
/* the ritning's name as it is written (V1.6.41): in capitals with spaced letters "RITNING 1" no longer fitted beside
   Välj and ✕ on a phone and broke into two lines, which "PLAN 1" never did */
.sidehead span {
  font-size: var(--fs-xs);
  color: var(--muted);
  overflow-wrap: break-word;
}
.sidebtns {
  flex: none;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: auto; /* to the right, also on a row of their own */
}
.sideclose {
  flex: none;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink); /* it closes the list and deletes nothing: not red (V1.6.39) */
  font-weight: 700;
}
/* the search's magnifier (V1.7.42): the same round button as ✕ beside it; while the search is open it is filled */
.flupe {
  flex: none;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
}
.flupe .ico {
  width: 24px;
  height: 24px;
}
.flupe.on {
  background: var(--tag-soft);
  border-color: var(--tag);
  color: var(--tag-deep);
}
.prow1.pickall .flupe {
  margin-left: auto;
}
.prow1.pickall .flupe + #pickdone {
  margin-left: 6px;
}
.orow .flupe {
  align-self: center;
}
.side .spacer {
  height: 96px;
  flex: 0 0 auto;
}
.sideempty {
  padding: 14px 12px;
  color: var(--muted);
  font-size: var(--fs-m);
  line-height: var(--lh);
  margin: 0;
}
.sitem {
  padding: 10px 12px 10px 10px;
  border-left: 4px solid transparent;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  display: grid;
  gap: 4px;
}
/* V1.7.36 (the user): the number, then the category, type, group and Prio on the same row; what does not fit goes on
   to the next row. The photo sits in the top right corner, beside them. */
.sitem {
  position: relative;
}
.sitem .stop {
  display: block; /* text flow round the photo: only the rows beside it make room for it, the rest get all the width */
  min-height: 33px;
}
.sitem .stop::after {
  content: "";
  display: block;
  clear: both;
}
.sitem .stop b {
  display: inline-block;
  line-height: 33px; /* the first row as high as the photo, so the rows after it have the whole width */
  margin-right: 8px;
  vertical-align: middle;
}
.sitem .stags {
  display: contents;
}
.sitem .stags > *,
.sitem .stags .ometa > * {
  display: inline-flex;
  max-width: 100%;
  margin: 3px 8px 3px 0;
  vertical-align: middle;
}
.sitem .stags .ometa,
.otop .ometa {
  display: contents;
}
.sitem .sfloor {
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--ink);
  overflow-wrap: anywhere; /* V1.8.44: a drawing's name in one long word made the list wider than its room (Alla) */
}
/* Denna / Alla (before V1.6.41: Detta plan / Alla plan): one row across the narrow list, half each (granskningen #19) */
.sidescope {
  display: flex;
  flex-wrap: nowrap;
  margin: 8px 12px;
}
.sidescope .seg {
  flex: 1 1 0;
  min-width: 0;
  padding: 6px 4px;
  font-size: var(--fs-s);
  white-space: normal; /* a long choice on two lines in its half rather than out of it (V1.6.38) */
  line-height: 1.15;
}
.sitem .stop b {
  font-family: var(--font-num);
  font-size: var(--fs-l);
  color: var(--tag);
  min-width: 24px;
  font-variant-numeric: tabular-nums;
}
.sitem .stop img {
  float: right;
  margin-left: 8px;
  width: 44px;
  height: 33px;
  object-fit: cover;
  border-radius: 4px;
}
.sitem p {
  margin: 0;
  font-size: var(--fs-m);
  line-height: var(--lh);
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.sitem p.none {
  color: var(--muted);
  font-style: italic;
}
.sactions {
  display: none;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 4px;
}
.sactions .sbtn {
  flex: 1 1 auto;
  padding: 6px 7px;
  font-size: var(--fs-xs);
}
.sitem.sel {
  background: var(--tag-soft);
  border-left-color: var(--tag);
}
.sitem.sel .sactions {
  display: flex;
}
.sitem.sel p {
  -webkit-line-clamp: unset;
  display: block;
}
.sbtn {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 8px;
  padding: 7px 6px;
  min-height: 44px;
  font-weight: 600;
  font-size: var(--fs-s);
}
.sbtn.danger {
  color: var(--danger);
}
.vp.with-side .hint {
  left: calc((100% - var(--sidew)) / 2);
  max-width: calc(100% - var(--sidew) - 24px);
}
.vp.with-side.side-left .hint {
  left: calc(var(--sidew) + (100% - var(--sidew)) / 2);
}
/* Självtest under Diagnosverktyg (V1.7.31): the three levels side by side, each with its time below its name.
   V1.8.44: a level's name is never broken inside the word (Snab-b, Norm-al on a narrow phone with large text) – the
   levels are as wide as each other while there is room, and one that does not fit goes to the next row */
.stlevels {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.stlevels .btn {
  flex: 1 1 0;
  min-width: min-content;
  display: grid;
  gap: 2px;
  padding: 6px 8px;
  overflow-wrap: normal;
}
.stlevels .btn small {
  font-weight: 400;
  font-size: var(--fs-xs);
  color: var(--muted);
}
/* the self-test's box sits at the bottom, above everything (also an export's own progress box in the middle), so
   Avbryt can always be reached; the layer still covers the app so nothing is tapped by mistake during the test */
.busy.stbusy {
  z-index: 60;
  background: transparent;
  place-items: end center;
  padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
}
.stbusy .pbox {
  display: grid;
  gap: 10px;
}
/* the phone's warmth, processor and memory right now (V1.7.39): may take two rows, never cut */
.stbusy #stlive {
  white-space: normal;
  overflow: visible;
  text-overflow: clip;
}
.stbusy #stlive:empty {
  display: none;
}
/* the list over the whole screen (V1.7.30): swiped away from its edge; the drawing lies unchanged behind it */
.vp .side.full {
  width: 100%;
  border-left: 0;
  border-right: 0;
  box-shadow: none;
}
/* the list on the tools' side (the default, Föredragen marginal: vänster): the left edge */
.vp.side-left .side {
  right: auto;
  left: 0;
  border-left: 0;
  border-right: 1px solid var(--line);
  box-shadow: 6px 0 18px rgba(0, 0, 0, 0.14);
}
/* with the list open the margin's round buttons are hidden – the list has its own close (granskningen #40) */
.vp.with-side .ltools {
  display: none;
}
.stage.anim {
  transition: transform 0.35s ease;
}
.stage.dim .mk:not(.sel) i {
  opacity: 0.35;
}
.mk.sel {
  z-index: 3;
}
.mk.fout i {
  opacity: 0.18;
}
.mk.fout {
  z-index: 0;
}
.vp.lifting .mk.moving i,
.vp.lifting .mk.move i {
  filter: drop-shadow(0 6px 6px rgba(0, 0, 0, 0.35));
}
.mk.chk.lifting {
  z-index: 4;
}
.mk.chk.lifting i {
  filter: drop-shadow(0 6px 6px rgba(0, 0, 0, 0.35));
  scale: 1.15;
}
.fbar {
  display: grid;
  gap: 8px;
  padding: 8px 0 4px;
}
/* big text on a small phone (fitSide in 17): what stays in place lets go, one part at a time, so that some of the list
   is always in sight */
.side.tight1 .fbar,
.side.tight2 .sidehead,
.side.tight3 .pickbar {
  position: static;
}
/* a row that scrolls sideways fades out at the edge where there is more (edgeFade in 07) */
.fade-r {
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
  mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
}
.fade-l {
  -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 28px), transparent);
  mask-image: linear-gradient(to left, #000 calc(100% - 28px), transparent);
}
.fade-l.fade-r {
  -webkit-mask-image: linear-gradient(to right, transparent, #000 28px, #000 calc(100% - 28px), transparent);
  mask-image: linear-gradient(to right, transparent, #000 28px, #000 calc(100% - 28px), transparent);
}
/* the search row: right under the heading, whose height is measured (one row, or two with big text) */
.side .fbar {
  position: sticky;
  top: calc(var(--headh, 65px) - 8px);
  z-index: 2;
  background: var(--surface);
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
}
/* the search field and the category chips (or, on the start page, the sorting – V1.8.5) in one place (V1.7.46, filterBar in 17): when the search opens the chips
   glide away downwards and the field glides down into their place, and back when it closes. Both lie in the same
   cell, so the list under them does not move. Without chips the place is empty while the search is closed. */
.fswap {
  display: grid;
  align-items: center;
  overflow: hidden;
  /* room for the field's focus ring (2 px line 2 px out), which the gliding's clipping would cut – 3 px cut its sides
     and squared its round corners (V1.7.47, the user) */
  padding: 6px;
  margin: -6px;
}
.fswap > * {
  grid-area: 1 / 1;
  min-width: 0;
  transition:
    transform 0.22s ease,
    opacity 0.18s ease,
    visibility 0s;
}
.fswap > .fqbox,
.sopen > .fswap > :not(.fqbox) {
  transform: translateY(-100%);
  opacity: 0;
  visibility: hidden;
  transition:
    transform 0.22s ease,
    opacity 0.18s ease,
    visibility 0s 0.22s;
}
.sopen > .fswap > :not(.fqbox) {
  transform: translateY(100%);
}
.sopen > .fswap > .fqbox {
  transform: none;
  opacity: 1;
  visibility: visible;
  transition-delay: 0s;
}
:not(.sopen) > .fswap.solo {
  display: none;
}
.sopen > .fswap.solo > .fqbox {
  animation: fqin 0.22s ease;
}
@keyframes fqin {
  from {
    transform: translateY(-100%);
    opacity: 0;
  }
}
.still > .fswap > *,
.still > .fswap.solo > .fqbox {
  transition: none;
  animation: none;
}
@media (prefers-reduced-motion: reduce) {
  .fswap > *,
  .sopen > .fswap.solo > .fqbox {
    transition: none;
    animation: none;
  }
}
.fsearch {
  width: 100%;
  font: inherit;
  font-size: var(--fs-b); /* 16 px or more: phones do not zoom in when the field is tapped */
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface);
  color: var(--ink);
}
.fchips {

}
.fchips::-webkit-scrollbar {

}
.fchips .cat {

}
/* typing in the list's search with the keyboard up (typingCheck in 17): Exportera and the choosing buttons at the
   bottom step aside (V1.7.43); the rest of the list stays as it is (V1.7.46) */
body.typing .view > .foot,
body.typing .opick,
body.typing .side .pickbar {
  display: none;
}
.ffoot[hidden] {
  display: none;
}
.fbar.fempty {

}
.side .fbar.fempty .prow1.pickall {

}
.ffoot {
  display: flex;

}
.finfo {

}
.fclear {
  font-size: var(--fs-s);

}
.fnone {

}
.mk.sel i {
  transform: translate(-50%, -50%) scale(calc(var(--inv, 1) * 1.35));
}
.mk.sel::after {
  content: "";
  position: absolute;
  left: -28px;
  top: -28px;
  width: 56px;

@media (prefers-reduced-motion: no-preference) {

    }

      transform: scale(calc(var(--inv, 1) * 1.5));
      opacity: 0;
    }
  }
}
.movebar {
  position: absolute;
  top: 10px;
  left: 10px;
  right: 10px;
  z-index: 7;
  display: flex;

.movebar span {

}
.movebar b {

}
.movebar .sbtn {

/* Avbryt and Klar stay together on one row, never split by the wrap */

.vp.with-side.side-left .movebar {

.stage.moveon .mk:not(.moving) i {

.mk.moving {

.mk.moving i {

.pgrid {

.ptile {

.pdel {

.cats {

.cat {

.cchip {

.listhead {

.linkbtn {
